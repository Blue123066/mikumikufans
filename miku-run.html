<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Miku 跑酷 · MIKUMIKUFANS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--miku:#39c5bb;--mint:#8df7e7;--bg:#061210;--line:rgba(57,197,187,.24);--text:#defbf8;--soft:rgba(222,251,248,.58);--gold:#ffd166;--pink:#ff6b91;--violet:#b69cff}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 52% 16%,rgba(57,197,187,.17),transparent 34%),radial-gradient(circle at 82% 78%,rgba(255,209,102,.08),transparent 28%),linear-gradient(180deg,#061210,#0b211e 58%,#061310);pointer-events:none}
.shell{position:relative;width:min(100vw - 18px,620px);height:min(100dvh - 18px,760px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#081a17;box-shadow:0 22px 80px rgba(0,0,0,.48),0 0 48px rgba(57,197,187,.16)}
canvas{display:block;width:100%;height:100%;background:#071714}
.back{position:absolute;top:78px;right:14px;z-index:8;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:rgba(6,18,16,.62);color:var(--soft);font-size:12px;letter-spacing:1px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.back:hover{color:var(--mint);border-color:var(--miku)}
.hud{position:absolute;left:12px;right:12px;top:12px;z-index:7;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;pointer-events:none}
.pill{min-height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(6,18,16,.64);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:900;font-size:12px;letter-spacing:1px;color:var(--soft)}
.pill strong{color:var(--mint);font-size:16px;line-height:1}
.meter{position:absolute;left:14px;right:14px;top:57px;z-index:7;height:12px;border:1px solid var(--line);border-radius:999px;background:rgba(6,18,16,.58);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--miku),var(--gold),var(--pink));box-shadow:0 0 18px rgba(255,209,102,.5);transition:width .12s linear}
.controls{position:absolute;left:12px;right:12px;bottom:12px;z-index:9;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrl{height:52px;border:1px solid var(--line);border-radius:14px;background:rgba(6,18,16,.74);color:var(--mint);font-weight:900;font-size:15px;letter-spacing:2px;font-family:inherit;box-shadow:inset 0 -8px 18px rgba(0,0,0,.18);transition:transform .08s,background .12s,border-color .12s,box-shadow .12s}
.ctrl.active{transform:translateY(2px) scale(.98);background:rgba(57,197,187,.2);border-color:var(--mint);box-shadow:0 0 18px rgba(57,197,187,.36)}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(4,12,11,.82);backdrop-filter:blur(7px)}
.overlay.hidden{display:none}
.panel{width:min(100%,390px);border:1px solid rgba(57,197,187,.26);border-radius:14px;background:rgba(8,24,21,.9);padding:28px 22px;text-align:center;box-shadow:0 0 42px rgba(57,197,187,.16)}
.title{font-family:Impact,"Arial Narrow",sans-serif;font-size:42px;line-height:.9;letter-spacing:3px;background:linear-gradient(135deg,var(--mint),var(--miku),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.subtitle{font-size:13px;color:var(--soft);letter-spacing:2px;line-height:1.7;margin-bottom:16px}
.mascot{width:170px;height:170px;object-fit:contain;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 18px rgba(57,197,187,.58))}
.score-big{font-family:Impact,"Arial Narrow",sans-serif;font-size:58px;color:var(--mint);text-shadow:0 0 24px rgba(57,197,187,.48);margin:8px 0 14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{height:42px;padding:0 24px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--miku),#1a8a82);color:#061210;font-weight:900;letter-spacing:2px;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .16s,box-shadow .16s}
.btn:hover{box-shadow:0 0 22px rgba(57,197,187,.42)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(222,251,248,.08);border:1px solid var(--line);color:var(--text)}
.hint{font-size:11px;color:rgba(222,251,248,.5);letter-spacing:1px;line-height:1.7;margin-top:14px}
@media(max-width:560px){
  .shell{width:100vw;height:100dvh;border:0;border-radius:0}
  .hud{left:8px;right:8px;top:8px;gap:6px}.pill{min-height:33px;font-size:10px}.pill strong{font-size:14px}
  .meter{left:10px;right:10px;top:48px}.back{top:63px;right:10px;height:28px;font-size:11px}
  .controls{left:8px;right:8px;bottom:8px;gap:8px}.ctrl{height:50px;border-radius:12px}
  .title{font-size:35px}.mascot{width:148px;height:148px}
}
</style>
</head>
<body>
<main class="shell">
  <canvas id="game"></canvas>
  <a class="back" href="mikumikufans.html">返回主页</a>
  <section class="hud" aria-label="游戏状态">
    <div class="pill">分数<strong id="score">0</strong></div>
    <div class="pill">距离<strong id="dist">0m</strong></div>
    <div class="pill">速度<strong id="speed">1.0x</strong></div>
    <div class="pill">最高<strong id="high">0</strong></div>
  </section>
  <div class="meter"><i id="meter"></i></div>
  <div class="controls" aria-label="跑酷按键">
    <button class="ctrl" id="jump-btn" type="button">跳跃</button>
    <button class="ctrl" id="slide-btn" type="button">下滑</button>
  </div>
  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="title">MIKU<br>RUN</div>
      <div class="subtitle">跳过障碍，收集音符和大葱</div>
      <img class="mascot" src="miku-sprite.png?v=20260621-3" alt="Miku sprite">
      <div class="row">
        <button class="btn" type="button" onclick="startGame()">开始跑酷</button>
        <a class="btn ghost" href="mikumikufans.html">回主页</a>
      </div>
      <div class="hint">空格 / W / 触摸跳跃，可二段跳<br>S / 下箭头 / 右侧按钮下滑</div>
    </div>
  </div>
</main>

<script>
(function(){
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var shell=document.querySelector(".shell");
var scoreEl=document.getElementById("score");
var distEl=document.getElementById("dist");
var speedEl=document.getElementById("speed");
var highEl=document.getElementById("high");
var meterEl=document.getElementById("meter");
var overlay=document.getElementById("overlay");
var jumpBtn=document.getElementById("jump-btn");
var slideBtn=document.getElementById("slide-btn");
var dpr=1,w=0,h=0,last=0,ground=0,shake=0;
var highKey="mikuRunHigh",high=Number(localStorage.getItem(highKey)||0);
var mikuImg=new Image();
mikuImg.src="miku-sprite.png?v=20260621-3";
var player={x:98,y:0,vy:0,w:54,h:132,jumps:0,slide:0,inv:0,pulse:0,trail:[]};
var state={running:false,score:0,dist:0,speed:245,lives:3,energy:0,fever:0,time:0};
var objects=[],particles=[],texts=[],spawnClock=0,clouds=[],audio=null;
highEl.textContent=high;

function fit(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  var rect=shell.getBoundingClientRect();
  w=Math.floor(rect.width);h=Math.floor(rect.height);
  canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ground=h-106;player.y=ground;
  clouds=[];
  for(var i=0;i<16;i++)clouds.push({x:Math.random()*w,y:90+Math.random()*(h*.38),s:.6+Math.random()*1.2,a:.12+Math.random()*.16});
}
window.addEventListener("resize",fit);fit();

function ensureAudio(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(freq,dur,gain){
  if(!audio)return;
  var t=audio.currentTime,osc=audio.createOscillator(),g=audio.createGain();
  osc.type="triangle";osc.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(gain||.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g);g.connect(audio.destination);osc.start(t);osc.stop(t+dur);
}
function addText(text,x,y,color){texts.push({text:text,x:x,y:y,life:.8,color:color})}
function burst(x,y,color,count){
  for(var i=0;i<(count||14);i++){
    var a=Math.random()*Math.PI*2,s=70+Math.random()*190;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+Math.random()*.28,color:color});
  }
}
function spawnObject(){
  var r=Math.random();
  if(r<.55){
    var kind=Math.random()<.5?"speaker":"heartbreak";
    objects.push({kind:kind,type:"bad",x:w+48,y:ground-(kind==="speaker"?40:58),w:42,h:kind==="speaker"?40:58,rot:0});
  }else{
    var kind2=r<.78?"note":"leek";
    objects.push({kind:kind2,type:"good",x:w+42,y:ground-(90+Math.random()*86),w:34,h:34,rot:0,value:kind2==="leek"?220:150});
  }
  if(Math.random()<.28){
    objects.push({kind:"star",type:"good",x:w+122,y:ground-(132+Math.random()*70),w:34,h:34,rot:0,value:340});
  }
}
function jump(){
  if(!state.running)return;
  jumpBtn.classList.add("active");setTimeout(function(){jumpBtn.classList.remove("active")},100);
  if(player.jumps<2){
    player.vy=player.jumps===0?-650:-540;
    player.jumps++;
    player.slide=0;
    player.pulse=.2;
    tone(player.jumps===1?660:880,.08,.035);
    burst(player.x,player.y-18,"#8df7e7",10);
  }
}
function slide(on){
  if(!state.running)return;
  slideBtn.classList.toggle("active",!!on);
  if(on&&player.jumps===0)player.slide=.48;
}
jumpBtn.addEventListener("pointerdown",function(e){e.preventDefault();jump()});
slideBtn.addEventListener("pointerdown",function(e){e.preventDefault();slide(true)});
slideBtn.addEventListener("pointerup",function(e){e.preventDefault();slide(false)});
slideBtn.addEventListener("pointercancel",function(){slide(false)});
window.addEventListener("keydown",function(e){
  if([" ","ArrowUp","w","W"].indexOf(e.key)>=0){e.preventDefault();jump()}
  if(["ArrowDown","s","S"].indexOf(e.key)>=0){e.preventDefault();slide(true)}
});
window.addEventListener("keyup",function(e){if(["ArrowDown","s","S"].indexOf(e.key)>=0)slide(false)});

function rectsOverlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function playerRect(){
  var sliding=player.slide>0&&player.jumps===0;
  return {x:player.x-22,y:player.y-(sliding?70:118),w:44,h:sliding?58:108};
}
function collect(obj){
  obj.dead=true;
  state.score+=obj.value;
  state.energy=Math.min(100,state.energy+(obj.kind==="star"?22:12));
  player.pulse=.18;
  addText("+"+obj.value,obj.x,obj.y,obj.kind==="star"?"#ffd166":"#8df7e7");
  burst(obj.x,obj.y,obj.kind==="star"?"#ffd166":"#8df7e7",obj.kind==="star"?24:14);
  tone(obj.kind==="star"?988:784,.07,.03);
}
function hit(obj){
  if(player.inv>0||state.fever>0)return;
  obj.dead=true;state.lives--;player.inv=1.25;shake=.28;state.energy=Math.max(0,state.energy-18);
  addText("-1",player.x+24,player.y-92,"#ff6b91");
  burst(player.x+18,player.y-72,"#ff6b91",24);
  tone(180,.13,.04);
  if(state.lives<=0)endGame("碰到太多障碍");
}
function activateFever(){
  if(state.energy<100||state.fever>0)return;
  state.energy=0;state.fever=5.8;player.inv=5.8;addText("MIKU DASH!",player.x+70,player.y-128,"#ffd166");burst(player.x+42,player.y-86,"#ffd166",36);tone(1046,.16,.045);
}
function update(dt){
  if(!state.running)return;
  state.time+=dt;
  var targetSpeed=245+Math.min(220,state.time*5.2)+(state.fever>0?140:0);
  state.speed+=(targetSpeed-state.speed)*(1-Math.pow(.001,dt));
  state.dist+=state.speed*dt*.032;
  state.score+=Math.floor(state.speed*dt*.04);
  if(state.fever>0)state.fever=Math.max(0,state.fever-dt);
  if(player.inv>0)player.inv=Math.max(0,player.inv-dt);
  if(shake>0)shake=Math.max(0,shake-dt);
  if(player.pulse>0)player.pulse=Math.max(0,player.pulse-dt);
  if(player.slide>0)player.slide=Math.max(0,player.slide-dt);

  spawnClock-=dt;
  if(spawnClock<=0){spawnObject();spawnClock=Math.max(.58,1.14-state.time*.006)+Math.random()*.26}
  player.vy+=1700*dt;player.y+=player.vy*dt;
  if(player.y>=ground){player.y=ground;player.vy=0;player.jumps=0}
  player.trail.push({x:player.x,y:player.y,life:.22,slide:player.slide});
  if(player.trail.length>8)player.trail.shift();
  for(var tr=player.trail.length-1;tr>=0;tr--){player.trail[tr].life-=dt;if(player.trail[tr].life<=0)player.trail.splice(tr,1)}
  var pr=playerRect();
  for(var i=objects.length-1;i>=0;i--){
    var o=objects[i];
    o.x-=state.speed*dt;o.rot+=dt*(o.type==="good"?4:2.2);
    if(rectsOverlap(pr,{x:o.x-o.w/2,y:o.y-o.h/2,w:o.w,h:o.h})){
      if(o.type==="good")collect(o);else hit(o);
    }
    if(o.dead||o.x<-90)objects.splice(i,1);
  }
  for(var p=particles.length-1;p>=0;p--){
    particles[p].life-=dt;particles[p].x+=particles[p].vx*dt;particles[p].y+=particles[p].vy*dt;particles[p].vy+=160*dt;
    if(particles[p].life<=0)particles.splice(p,1);
  }
  for(var t=texts.length-1;t>=0;t--){texts[t].life-=dt;texts[t].y-=44*dt;if(texts[t].life<=0)texts.splice(t,1)}
  if(state.energy>=100&&state.fever<=0)activateFever();
}
function drawBg(now){
  var g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#071714");g.addColorStop(.55,"#0d2925");g.addColorStop(1,"#061310");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*14*shake);
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];c.x-=state.running?state.speed*.08*c.s/60:0;if(c.x<-60)c.x=w+60;
    ctx.fillStyle="rgba(141,247,231,"+c.a+")";ctx.beginPath();ctx.ellipse(c.x,c.y,34*c.s,10*c.s,0,0,Math.PI*2);ctx.fill();
  }
  var floorY=ground+14;
  ctx.fillStyle="rgba(57,197,187,.10)";ctx.fillRect(0,floorY,w,h-floorY);
  ctx.strokeStyle="rgba(57,197,187,.18)";ctx.lineWidth=2;
  for(var x=-((state.dist*22)%52);x<w+52;x+=52){ctx.beginPath();ctx.moveTo(x,floorY);ctx.lineTo(x+28,h);ctx.stroke()}
  ctx.strokeStyle="rgba(255,209,102,.55)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ground+2);ctx.lineTo(w,ground+2);ctx.stroke();
  if(state.fever>0){ctx.fillStyle="rgba(255,209,102,.08)";ctx.fillRect(0,0,w,h)}
  ctx.restore();
}
function drawMiku(now){
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*14*shake);
  for(var i=0;i<player.trail.length;i++){
    var tr=player.trail[i],a=tr.life*1.2;ctx.globalAlpha=a*.22;drawSprite(tr.x-12*i,tr.y,now,true,tr.slide);
  }
  ctx.globalAlpha=1;
  if(player.inv>0&&Math.floor(now*18)%2===0)ctx.globalAlpha=.45;
  drawSprite(player.x,player.y+Math.sin(now*14)*1.8,now,false,player.slide);
  ctx.globalAlpha=1;ctx.restore();
}
function drawSprite(x,y,now,ghost,slideTime){
  var sliding=slideTime>0&&player.jumps===0;
  var drawH=sliding?104:142,drawW=drawH*(mikuImg.naturalWidth&&mikuImg.naturalHeight?mikuImg.naturalWidth/mikuImg.naturalHeight:1);
  var scale=1+(player.pulse*.36)+(state.fever>0?.04:0);
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  if(sliding){ctx.rotate(-.08);ctx.scale(1.08,.76);ctx.translate(0,30)}
  ctx.fillStyle=state.fever>0?"rgba(255,209,102,.26)":"rgba(57,197,187,.18)";
  ctx.beginPath();ctx.ellipse(0,-6,46,10,0,0,Math.PI*2);ctx.fill();
  if(mikuImg.complete&&mikuImg.naturalWidth>0){
    ctx.shadowBlur=ghost?0:18;ctx.shadowColor=state.fever>0?"#ffd166":"rgba(57,197,187,.5)";
    ctx.drawImage(mikuImg,-drawW/2,-drawH,drawW,drawH);
  }else{
    ctx.fillStyle="#39c5bb";ctx.fillRect(-20,-118,40,118);
  }
  ctx.restore();
}
function drawObjects(){
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(var i=0;i<objects.length;i++){
    var o=objects[i];ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    var icon=o.kind==="speaker"?"▣":o.kind==="heartbreak"?"💔":o.kind==="leek"?"🥬":o.kind==="star"?"⭐":"🎵";
    var color=o.type==="bad"?"#ff6b91":o.kind==="star"?"#ffd166":"#8df7e7";
    ctx.shadowColor=color;ctx.shadowBlur=18;
    if(o.kind==="speaker"){
      ctx.fillStyle="rgba(255,107,145,.20)";roundRect(-22,-22,44,44,10);ctx.fill();ctx.strokeStyle="rgba(255,107,145,.75)";ctx.stroke();
      ctx.fillStyle=color;ctx.font="900 26px Impact, Arial Narrow, sans-serif";ctx.fillText(icon,0,1);
    }else{
      ctx.fillStyle="rgba(6,18,16,.52)";ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();
      ctx.font=(o.type==="bad"?"28px":"30px")+" Apple Color Emoji, Segoe UI Emoji, sans-serif";ctx.fillText(icon,0,1);
    }
    ctx.restore();
  }
}
function roundRect(x,y,ww,hh,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+ww,y,x+ww,y+hh,r);ctx.arcTo(x+ww,y+hh,x,y+hh,r);ctx.arcTo(x,y+hh,x,y,r);ctx.arcTo(x,y,x+ww,y,r);ctx.closePath();
}
function drawEffects(){
  for(var i=0;i<particles.length;i++){var p=particles[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  for(var t=0;t<texts.length;t++){var tx=texts[t];ctx.globalAlpha=Math.max(0,tx.life);ctx.fillStyle=tx.color;ctx.shadowColor=tx.color;ctx.shadowBlur=10;ctx.fillText(tx.text,tx.x,tx.y)}
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  if(state.fever>0){ctx.fillStyle="#ffd166";ctx.font="900 22px Impact, Arial Narrow, sans-serif";ctx.fillText("MIKU DASH "+Math.ceil(state.fever),w/2,96)}
}
function draw(now){
  drawBg(now);drawObjects();drawMiku(now);drawEffects();
  var hearts="";for(var i=0;i<3;i++)hearts+=i<state.lives?"♥":"♡";
  scoreEl.textContent=state.score+" "+hearts;distEl.textContent=Math.floor(state.dist)+"m";speedEl.textContent=(state.speed/245).toFixed(1)+"x";highEl.textContent=high;meterEl.style.width=state.energy+"%";
}
function loop(ts){
  var now=ts/1000,dt=last?Math.min(.05,(ts-last)/1000):.016;last=ts;
  update(dt);draw(now);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function startGame(){
  ensureAudio();
  state={running:true,score:0,dist:0,speed:245,lives:3,energy:0,fever:0,time:0};
  objects=[];particles=[];texts=[];spawnClock=.55;player.y=ground;player.vy=0;player.jumps=0;player.slide=0;player.inv=0;player.trail=[];last=performance.now();
  overlay.classList.add("hidden");
}
function endGame(reason){
  if(!state.running)return;
  state.running=false;slide(false);
  var final=Math.floor(state.score+state.dist*12);
  if(final>high){high=final;localStorage.setItem(highKey,String(high))}
  var rank=final>=18000?"世界巡演级":final>=11000?"舞台疾走者":final>=5600?"应援跑者":"热身练习生";
  overlay.innerHTML='<div class="panel"><div class="title">RESULT</div><div class="subtitle">'+reason+' · '+rank+'</div><div class="score-big">'+final+'</div><div class="subtitle">距离 '+Math.floor(state.dist)+'m · 最高分 '+high+'</div><div class="row"><button class="btn" type="button" onclick="startGame()">再跑一次</button><a class="btn ghost" href="mikumikufans.html">回主页</a></div></div>';
  overlay.classList.remove("hidden");
}
window.startGame=startGame;
draw(0);
})();
</script>
