<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>接住大葱！· MIKUMIKUFANS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--miku:#39c5bb;--mint:#8df7e7;--deep:#08201d;--panel:rgba(10,28,25,0.82);--line:rgba(57,197,187,0.24);--text:#d9fbf7;--soft:rgba(217,251,247,0.62);--gold:#ffd166;--pink:#ff6b91}
body{min-height:100vh;min-height:100dvh;background:#061210;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,rgba(57,197,187,0.18),transparent 34%),radial-gradient(circle at 16% 78%,rgba(255,209,102,0.1),transparent 28%),linear-gradient(180deg,#061210,#0a211e 52%,#071613);pointer-events:none}
.shell{position:relative;width:min(100vw - 18px,520px);height:min(100dvh - 18px,720px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#091a17;box-shadow:0 22px 80px rgba(0,0,0,0.45),0 0 48px rgba(57,197,187,0.16)}
canvas{display:block;width:100%;height:100%;background:linear-gradient(180deg,#0a201d,#0d302a 48%,#10231f)}
.back-link{position:absolute;top:78px;right:14px;z-index:8;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:rgba(6,18,16,0.58);color:var(--soft);font-size:12px;letter-spacing:1px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.back-link:hover{color:var(--mint);border-color:var(--miku)}
.hud{position:absolute;left:12px;right:12px;top:12px;z-index:6;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;pointer-events:none}
.pill{min-height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(6,18,16,0.62);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;gap:5px;font-weight:900;font-size:13px;letter-spacing:1px;color:var(--text);text-shadow:0 0 10px rgba(57,197,187,0.38)}
.pill strong{color:var(--mint);font-size:16px}
.meter{position:absolute;left:14px;right:14px;top:56px;z-index:6;height:12px;border:1px solid var(--line);border-radius:999px;background:rgba(6,18,16,0.58);overflow:hidden}
.meter-fill{height:100%;width:0;background:linear-gradient(90deg,var(--miku),var(--gold),var(--pink));box-shadow:0 0 18px rgba(255,209,102,0.5);transition:width 0.16s linear}
.skill{position:absolute;left:50%;bottom:18px;z-index:7;transform:translateX(-50%);height:42px;min-width:156px;border:1px solid rgba(255,209,102,0.42);border-radius:24px;background:rgba(255,209,102,0.12);color:var(--gold);font-weight:900;letter-spacing:2px;font-family:inherit;box-shadow:0 0 22px rgba(255,209,102,0.14);cursor:pointer;transition:transform 0.16s,opacity 0.16s,box-shadow 0.16s}
.skill.ready{background:linear-gradient(135deg,var(--gold),#fff1a8);color:#201408;box-shadow:0 0 26px rgba(255,209,102,0.58)}
.skill:active{transform:translateX(-50%) scale(0.94)}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(4,12,11,0.82);backdrop-filter:blur(7px)}
.overlay.hidden{display:none}
.panel{width:min(100%,360px);border:1px solid rgba(57,197,187,0.26);border-radius:14px;background:rgba(8,24,21,0.88);padding:28px 22px;text-align:center;box-shadow:0 0 42px rgba(57,197,187,0.16)}
.title{font-family:Impact,"Arial Narrow",sans-serif;font-size:42px;line-height:0.9;letter-spacing:3px;background:linear-gradient(135deg,var(--mint),var(--miku),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.subtitle{font-size:13px;color:var(--soft);letter-spacing:2px;line-height:1.7;margin-bottom:16px}
.big-score{font-family:Impact,"Arial Narrow",sans-serif;font-size:58px;letter-spacing:2px;color:var(--mint);text-shadow:0 0 24px rgba(57,197,187,0.5);margin:8px 0 14px}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{height:42px;padding:0 24px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--miku),#1a8a82);color:#061210;font-weight:900;letter-spacing:2px;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform 0.16s,box-shadow 0.16s}
.btn:hover{box-shadow:0 0 22px rgba(57,197,187,0.42)}
.btn:active{transform:scale(0.95)}
.btn.ghost{background:rgba(217,251,247,0.08);border:1px solid var(--line);color:var(--text)}
.hint{font-size:11px;color:rgba(217,251,247,0.48);letter-spacing:1px;line-height:1.7;margin-top:14px}
@media(max-width:560px){
  .shell{width:100vw;height:100dvh;border-radius:0;border:0}
  .hud{left:8px;right:8px;top:8px;gap:6px}
  .pill{min-height:32px;font-size:11px;border-radius:9px}
  .pill strong{font-size:14px}
  .meter{left:10px;right:10px;top:47px}
  .back-link{top:62px;right:10px;height:28px;font-size:11px}
  .title{font-size:34px}
  .skill{bottom:14px}
}
</style>
</head>
<body>
<main class="shell">
  <canvas id="game"></canvas>
  <a class="back-link" href="mikumikufans.html">返回主页</a>
  <section class="hud" aria-label="游戏状态">
    <div class="pill">🥬 <strong id="score">0</strong></div>
    <div class="pill">⏱ <strong id="time">60</strong></div>
    <div class="pill" id="lives">❤️ ❤️ ❤️</div>
  </section>
  <div class="meter"><div class="meter-fill" id="meter"></div></div>
  <button class="skill" id="skill" type="button">MIKU TIME</button>
  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="title">MIKU LEAF<br>CATCH</div>
      <div class="subtitle">60 秒接葱挑战</div>
      <div style="font-size:60px;margin:12px 0;filter:drop-shadow(0 0 18px rgba(57,197,187,0.55))">🥬</div>
      <div class="btn-row">
        <button class="btn" type="button" onclick="startGame()">开始游戏</button>
        <a class="btn ghost" href="mikumikufans.html">回主页</a>
      </div>
      <div class="hint">方向键 / A D / 鼠标或手指拖动<br>连击、金葱和 MIKU TIME 会大幅加分</div>
    </div>
  </div>
</main>

<script>
(function(){
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var shell=document.querySelector(".shell");
var scoreEl=document.getElementById("score");
var timeEl=document.getElementById("time");
var livesEl=document.getElementById("lives");
var meterEl=document.getElementById("meter");
var skillEl=document.getElementById("skill");
var overlay=document.getElementById("overlay");
var dpr=1,w=0,h=0,last=0,spawnClock=0,keys={},pointer=false,shake=0;
var highKey="mikuCatchHigh";
var high=Number(localStorage.getItem(highKey)||0);
var player={x:0,targetX:0,y:0,w:70,h:100,vx:0,tilt:0,pulse:0};
var state={running:false,score:0,combo:0,misses:0,time:60,energy:0,fever:0,slow:0,high:high};
var items=[],particles=[],texts=[];
var mikuImg=new Image();
mikuImg.src="miku-sprite.png?v=20260621-3";
var types=[
  {id:"leek",icon:"🥬",score:1,energy:7,miss:true,color:"#8df7a6",chance:58},
  {id:"gold",icon:"✨",score:5,energy:16,miss:false,color:"#ffd166",chance:12},
  {id:"note",icon:"🎵",score:2,energy:12,miss:false,color:"#7ce7ff",chance:12},
  {id:"star",icon:"⭐",score:3,energy:24,miss:false,color:"#ffe66d",chance:8},
  {id:"bad",icon:"💔",score:0,energy:0,miss:false,bad:true,color:"#ff6b91",chance:10}
];

function fit(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  var rect=shell.getBoundingClientRect();
  w=Math.floor(rect.width);h=Math.floor(rect.height);
  canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";
  player.x=w/2;player.targetX=w/2;player.y=h-108;
}
window.addEventListener("resize",fit);
fit();

function pickType(){
  var total=types.reduce(function(a,t){return a+t.chance},0);
  var r=Math.random()*total;
  for(var i=0;i<types.length;i++){r-=types[i].chance;if(r<=0)return types[i]}
  return types[0];
}

function spawnItem(){
  var type=pickType();
  var radius=type.id==="gold"||type.id==="star"?20:18;
  items.push({
    type:type,x:24+Math.random()*(w-48),y:-32,r:radius,
    vy:120+Math.random()*70+Math.min(120,state.score*0.8),
    spin:(Math.random()-0.5)*4,rot:Math.random()*6.28,
    phase:Math.random()*Math.PI*2,trail:[]
  });
}

function addText(text,x,y,color){
  texts.push({text:text,x:x,y:y,life:0.9,color:color||"#8df7e7"});
}

function burst(x,y,color,count){
  for(var i=0;i<(count||14);i++){
    var a=Math.random()*Math.PI*2;
    var s=80+Math.random()*190;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45+Math.random()*0.35,color:color});
  }
}

function multiplier(){
  var comboMul=Math.min(5,1+Math.floor(state.combo/10));
  return comboMul*(state.fever>0?2:1);
}

function catchItem(item){
  var type=item.type;
  if(type.bad){
    state.combo=0;
    if(state.fever<=0){state.score=Math.max(0,state.score-3);shake=0.18}
    addText(state.fever>0?"FEVER BLOCK":"-3",item.x,item.y,type.color);
    burst(item.x,item.y,type.color,12);
    return;
  }
  state.combo++;
  if(type.id==="note")state.slow=3.6;
  var gain=Math.max(1,Math.round(type.score*multiplier()));
  state.score+=gain;
  state.energy=Math.min(100,state.energy+type.energy+(state.combo%8===0?6:0));
  player.pulse=0.22;
  addText("+"+gain+(state.combo>=5?"  x"+state.combo:""),item.x,item.y,type.color);
  burst(item.x,item.y,type.color,type.id==="gold"?24:14);
}

function activateFever(){
  if(!state.running||state.energy<100||state.fever>0)return;
  state.energy=0;
  state.fever=6.5;
  addText("MIKU TIME!",player.x,player.y-70,"#ffd166");
  burst(player.x,player.y-48,"#ffd166",42);
}
skillEl.addEventListener("click",activateFever);

function input(){
  window.addEventListener("keydown",function(e){
    if(["ArrowLeft","ArrowRight","a","A","d","D"," "].indexOf(e.key)>=0)e.preventDefault();
    keys[e.key]=true;
    if(e.key===" ")activateFever();
  });
  window.addEventListener("keyup",function(e){keys[e.key]=false});
  canvas.addEventListener("pointerdown",function(e){pointer=true;movePointer(e)});
  canvas.addEventListener("pointermove",function(e){if(pointer)movePointer(e)});
  window.addEventListener("pointerup",function(){pointer=false});
}
function movePointer(e){
  var r=canvas.getBoundingClientRect();
  player.targetX=e.clientX-r.left;
}
input();

function update(dt){
  if(!state.running)return;
  state.time-=dt;
  if(state.time<=0){state.time=0;endGame("挑战完成");return}
  if(state.fever>0)state.fever=Math.max(0,state.fever-dt);
  if(state.slow>0)state.slow=Math.max(0,state.slow-dt);
  if(shake>0)shake=Math.max(0,shake-dt);

  var move=430*dt;
  if(keys.ArrowLeft||keys.a||keys.A)player.targetX-=move;
  if(keys.ArrowRight||keys.d||keys.D)player.targetX+=move;
  player.targetX=Math.max(36,Math.min(w-36,player.targetX));
  var before=player.x;
  var ease=1-Math.pow(0.0008,dt);
  player.x+=(player.targetX-player.x)*ease;
  player.tilt+=(Math.max(-0.2,Math.min(0.2,(player.x-before)*0.03))-player.tilt)*(1-Math.pow(0.001,dt));
  if(player.pulse>0)player.pulse=Math.max(0,player.pulse-dt);

  spawnClock-=dt;
  var pace=Math.max(0.34,0.78-state.score/650);
  if(state.fever>0)pace=0.3;
  if(spawnClock<=0){spawnItem();spawnClock=pace}

  var fallFactor=state.slow>0?0.55:1;
  for(var i=items.length-1;i>=0;i--){
    var it=items[i];
    if(state.fever>0&&it.type.id!=="bad"){
      var dx=player.x-it.x;
      if(Math.abs(dx)<170&&it.y>40)it.x+=dx*dt*1.7;
    }
    it.trail.push({x:it.x,y:it.y,life:0.22});
    if(it.trail.length>5)it.trail.shift();
    for(var tr=it.trail.length-1;tr>=0;tr--){
      it.trail[tr].life-=dt;
      if(it.trail[tr].life<=0)it.trail.splice(tr,1);
    }
    it.x+=Math.sin(last*0.002+it.phase)*18*dt;
    it.y+=it.vy*dt*fallFactor;
    it.rot+=it.spin*dt;
    var catchWidth=(state.fever>0?118:76);
    var nearX=Math.abs(it.x-player.x)<catchWidth/2+it.r;
    var nearY=it.y+it.r>player.y-68&&it.y-it.r<player.y+20;
    if(nearX&&nearY){
      items.splice(i,1);
      catchItem(it);
      continue;
    }
    if(it.y>h+40){
      items.splice(i,1);
      if(it.type.miss){
        state.combo=0;
        state.misses++;
        shake=0.22;
        addText("-1",it.x,h-90,"#ff6b91");
        if(state.misses>=3)endGame("漏掉了太多大葱");
      }
    }
  }

  for(var p=particles.length-1;p>=0;p--){
    particles[p].life-=dt;
    particles[p].x+=particles[p].vx*dt;
    particles[p].y+=particles[p].vy*dt;
    particles[p].vy+=180*dt;
    if(particles[p].life<=0)particles.splice(p,1);
  }
  for(var t=texts.length-1;t>=0;t--){
    texts[t].life-=dt;
    texts[t].y-=42*dt;
    if(texts[t].life<=0)texts.splice(t,1);
  }
}

function drawBg(now){
  var g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#071815");g.addColorStop(0.48,"#0d302a");g.addColorStop(1,"#071310");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*10*shake,(Math.random()-0.5)*10*shake);
  ctx.strokeStyle="rgba(57,197,187,0.08)";ctx.lineWidth=1;
  for(var y=88;y<h;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  for(var x=24;x<w;x+=54){ctx.beginPath();ctx.moveTo(x,76);ctx.lineTo(x,h);ctx.stroke()}
  for(var i=0;i<38;i++){
    var sx=(i*91+now*14)%w;
    var sy=(i*137+40)%h;
    var a=0.24+Math.sin(now*2+i)*0.18;
    ctx.fillStyle="rgba(141,247,231,"+a+")";
    ctx.beginPath();ctx.arc(sx,sy,1.2,0,Math.PI*2);ctx.fill();
  }
  if(state.fever>0){
    ctx.fillStyle="rgba(255,209,102,0.08)";
    ctx.fillRect(0,0,w,h);
  }
  ctx.restore();
}

function drawMiku(now){
  var x=player.x,y=player.y;
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*10*shake,(Math.random()-0.5)*10*shake);
  ctx.fillStyle=state.fever>0?"rgba(255,209,102,0.28)":"rgba(57,197,187,0.18)";
  ctx.beginPath();ctx.ellipse(x,y-8,58+player.pulse*40,13+player.pulse*8,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=state.fever>0?"rgba(255,209,102,0.7)":"rgba(141,247,231,0.28)";
  ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(x,y-8,66+Math.sin(now*4)*3,16,0,0,Math.PI*2);ctx.stroke();
  var bob=Math.sin(now*7)*2.4;
  ctx.translate(x,y+bob);
  ctx.rotate(player.tilt);
  var scale=1+(player.pulse*0.45)+(state.fever>0?0.03:0);
  ctx.scale(scale,scale);
  if(state.fever>0){
    ctx.shadowBlur=26;ctx.shadowColor="#ffd166";
    ctx.strokeStyle="rgba(255,209,102,0.8)";ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,-48,62+Math.sin(now*10)*3,0,Math.PI*2);ctx.stroke();
  }
  ctx.shadowBlur=18;ctx.shadowColor="rgba(57,197,187,0.45)";
  if(mikuImg.complete&&mikuImg.naturalWidth>0){
    var spriteH=224;
    var spriteW=spriteH*(mikuImg.naturalWidth/mikuImg.naturalHeight);
    ctx.drawImage(mikuImg,-spriteW/2,-spriteH,spriteW,spriteH);
  }else{
    ctx.fillStyle="#39c5bb";
    ctx.beginPath();ctx.ellipse(-34,-42,13,45,-0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(34,-42,13,45,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#f4d7c8";ctx.beginPath();ctx.arc(0,-70,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#172826";ctx.fillRect(-20,-52,40,48);
    ctx.fillStyle="#39c5bb";ctx.fillRect(-5,-50,10,40);
  }
  ctx.restore();
}

function drawItems(){
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var groundAlpha=Math.max(0,Math.min(0.35,(it.y-80)/(h-180)));
    if(groundAlpha>0){
      ctx.fillStyle="rgba(57,197,187,"+groundAlpha+")";
      ctx.beginPath();ctx.ellipse(it.x,player.y-10,10+it.r*0.45,3.5,0,0,Math.PI*2);ctx.fill();
    }
    for(var j=0;j<it.trail.length;j++){
      var tr=it.trail[j];
      ctx.globalAlpha=Math.max(0,tr.life*2.8);
      ctx.fillStyle=it.type.color;
      ctx.beginPath();ctx.arc(tr.x,tr.y,Math.max(2,it.r*0.28*tr.life*5),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.save();
    ctx.translate(it.x,it.y);ctx.rotate(it.rot);
    ctx.shadowColor=it.type.color;ctx.shadowBlur=it.type.bad?10:18;
    ctx.fillStyle="rgba(6,18,16,0.5)";
    ctx.beginPath();ctx.arc(0,0,it.r+6,0,Math.PI*2);ctx.fill();
    ctx.font=(it.type.id==="gold"||it.type.id==="star"?"28px":"30px")+" Apple Color Emoji, Segoe UI Emoji, sans-serif";
    ctx.fillText(it.type.icon,0,1);
    ctx.restore();
  }
}

function drawEffects(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  for(var t=0;t<texts.length;t++){
    var tx=texts[t];
    ctx.globalAlpha=Math.max(0,tx.life);
    ctx.fillStyle=tx.color;
    ctx.shadowColor=tx.color;ctx.shadowBlur=10;
    ctx.fillText(tx.text,tx.x,tx.y);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  if(state.combo>=5&&state.running){
    ctx.fillStyle=state.fever>0?"#ffd166":"#8df7e7";
    ctx.font="900 22px Impact, Arial Narrow, sans-serif";
    ctx.fillText("COMBO "+state.combo+"  x"+multiplier(),w/2,92);
  }
  if(state.slow>0&&state.running){
    ctx.fillStyle="#7ce7ff";ctx.font="900 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
    ctx.fillText("SLOW BEAT",w/2,116);
  }
}

function draw(now){
  drawBg(now);
  drawItems();
  drawMiku(now);
  drawEffects();
  scoreEl.textContent=state.score;
  timeEl.textContent=Math.ceil(state.time);
  var hearts="";
  for(var i=0;i<3;i++)hearts+=i<3-state.misses?"❤️ ":"🖤 ";
  livesEl.textContent=hearts.trim();
  meterEl.style.width=state.energy+"%";
  skillEl.classList.toggle("ready",state.energy>=100&&state.fever<=0&&state.running);
  skillEl.textContent=state.fever>0?"FEVER "+Math.ceil(state.fever):state.energy>=100?"MIKU TIME":"MIKU TIME";
}

function loop(ts){
  var now=ts/1000;
  var dt=last?Math.min(0.05,(ts-last)/1000):0.016;
  last=ts;
  update(dt);
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGame(){
  state.running=true;state.score=0;state.combo=0;state.misses=0;state.time=60;state.energy=0;state.fever=0;state.slow=0;
  items=[];particles=[];texts=[];spawnClock=0;player.x=w/2;player.targetX=w/2;player.tilt=0;player.pulse=0;overlay.classList.add("hidden");last=performance.now();
}

function endGame(reason){
  if(!state.running)return;
  state.running=false;
  if(state.score>state.high){state.high=state.score;localStorage.setItem(highKey,String(state.high))}
  var rank=state.score>=220?"葱王":state.score>=140?"应援达人":state.score>=80?"节拍守护者":"葱苗练习生";
  overlay.innerHTML='<div class="panel"><div class="title">RESULT</div><div class="subtitle">'+reason+'</div><div class="big-score">🥬 '+state.score+'</div><div class="subtitle">'+rank+' · 最高分 '+state.high+'</div><div class="btn-row"><button class="btn" type="button" onclick="startGame()">再来一次</button><a class="btn ghost" href="mikumikufans.html">回主页</a></div><div class="hint">金葱、星星和 MIKU TIME 是冲高分关键</div></div>';
  overlay.classList.remove("hidden");
}

window.startGame=startGame;
window.activateFever=activateFever;
draw(0);
})();
</script>
