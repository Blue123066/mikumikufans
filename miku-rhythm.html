<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Miku 音游 · MIKUMIKUFANS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--miku:#39c5bb;--mint:#8df7e7;--bg:#071714;--panel:rgba(8,28,24,.88);--line:rgba(57,197,187,.28);--text:#defbf8;--soft:rgba(222,251,248,.62);--gold:#ffd166;--pink:#ff6b91;--blue:#77ddff}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 14%,rgba(57,197,187,.22),transparent 34%),radial-gradient(circle at 18% 82%,rgba(255,107,145,.08),transparent 28%),radial-gradient(circle at 82% 64%,rgba(255,209,102,.07),transparent 24%),linear-gradient(180deg,#071714,#0c2824 56%,#071613);pointer-events:none}
.shell{position:relative;width:min(100vw - 18px,540px);height:min(100dvh - 18px,760px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#09211d;box-shadow:0 22px 80px rgba(0,0,0,.46),0 0 58px rgba(57,197,187,.20)}
canvas{display:block;width:100%;height:100%;background:#0a1d1a}
.back{position:absolute;top:78px;right:14px;z-index:8;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:rgba(6,18,16,.62);color:var(--soft);font-size:12px;letter-spacing:1px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.back:hover{color:var(--mint);border-color:var(--miku)}
.hud{position:absolute;left:12px;right:12px;top:12px;z-index:7;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;pointer-events:none}
.pill{min-height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(6,18,16,.64);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:900;font-size:12px;letter-spacing:1px;color:var(--soft)}
.pill strong{color:var(--mint);font-size:16px;line-height:1}
.meter{position:absolute;left:14px;right:14px;top:57px;z-index:7;height:12px;border:1px solid var(--line);border-radius:999px;background:rgba(6,18,16,.58);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--miku),var(--gold),var(--pink));box-shadow:0 0 18px rgba(255,209,102,.5);transition:width .12s linear}
.lanes{position:absolute;left:12px;right:12px;bottom:12px;z-index:9;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lane-btn{height:50px;border:1px solid var(--line);border-radius:12px;background:rgba(6,18,16,.74);color:var(--mint);font-weight:900;font-size:15px;letter-spacing:2px;font-family:inherit;box-shadow:inset 0 -8px 18px rgba(0,0,0,.18);transition:transform .08s,background .12s,border-color .12s,box-shadow .12s}
.lane-btn.active{transform:translateY(2px) scale(.97);background:rgba(57,197,187,.2);border-color:var(--mint);box-shadow:0 0 18px rgba(57,197,187,.36)}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(4,12,11,.82);backdrop-filter:blur(7px)}
.overlay.hidden{display:none}
.panel{width:min(100%,380px);border:1px solid rgba(57,197,187,.26);border-radius:14px;background:rgba(8,24,21,.9);padding:28px 22px;text-align:center;box-shadow:0 0 42px rgba(57,197,187,.16)}
.title{font-family:Impact,"Arial Narrow",sans-serif;font-size:42px;line-height:.9;letter-spacing:3px;background:linear-gradient(135deg,var(--mint),var(--miku),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.subtitle{font-size:13px;color:var(--soft);letter-spacing:2px;line-height:1.7;margin-bottom:16px}
.mascot{width:168px;height:168px;object-fit:contain;display:block;margin:0 auto 14px;filter:saturate(1.12) hue-rotate(-4deg) brightness(1.05) drop-shadow(0 0 18px rgba(57,197,187,.62)) drop-shadow(0 0 4px rgba(141,247,231,.36))}
.score-big{font-family:Impact,"Arial Narrow",sans-serif;font-size:58px;color:var(--mint);text-shadow:0 0 24px rgba(57,197,187,.48);margin:8px 0 14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{height:42px;padding:0 24px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--miku),#1a8a82);color:#061210;font-weight:900;letter-spacing:2px;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .16s,box-shadow .16s}
.btn:hover{box-shadow:0 0 22px rgba(57,197,187,.42)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(222,251,248,.08);border:1px solid var(--line);color:var(--text)}
.hint{font-size:11px;color:rgba(222,251,248,.5);letter-spacing:1px;line-height:1.7;margin-top:14px}
@media(max-width:560px){
  .shell{width:100vw;height:100dvh;border:0;border-radius:0}
  .hud{left:8px;right:8px;top:8px;gap:6px}.pill{min-height:33px;font-size:10px}.pill strong{font-size:14px}
  .meter{left:10px;right:10px;top:48px}.back{top:63px;right:10px;height:28px;font-size:11px}
  .lanes{left:8px;right:8px;bottom:8px;gap:6px}.lane-btn{height:48px;border-radius:10px}
  .title{font-size:35px}.mascot{width:146px;height:146px}
}
</style>
</head>
<body>
<main class="shell">
  <canvas id="game"></canvas>
  <a class="back" href="mikumikufans.html">返回主页</a>
  <section class="hud" aria-label="游戏状态">
    <div class="pill">分数<strong id="score">0</strong></div>
    <div class="pill">连击<strong id="combo">0</strong></div>
    <div class="pill">时间<strong id="time">60</strong></div>
    <div class="pill">最高<strong id="high">0</strong></div>
  </section>
  <div class="meter"><i id="meter"></i></div>
  <div class="lanes" aria-label="节奏按键">
    <button class="lane-btn" data-lane="0" type="button">D</button>
    <button class="lane-btn" data-lane="1" type="button">F</button>
    <button class="lane-btn" data-lane="2" type="button">J</button>
    <button class="lane-btn" data-lane="3" type="button">K</button>
  </div>
  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="title">MIKU<br>RHYTHM</div>
      <div class="subtitle">四键节奏挑战 · 108 BPM</div>
      <img class="mascot" src="miku-sprite.png?v=20260621-3" alt="Miku sprite">
      <div class="row">
        <button class="btn" type="button" onclick="startGame()">开始演奏</button>
        <a class="btn ghost" href="mikumikufans.html">回主页</a>
      </div>
      <div class="hint">D F J K / 手机点底部按键<br>跟着节拍，越接近判定线分数越高</div>
    </div>
  </div>
</main>

<script>
(function(){
var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var shell=document.querySelector(".shell");
var scoreEl=document.getElementById("score");
var comboEl=document.getElementById("combo");
var timeEl=document.getElementById("time");
var highEl=document.getElementById("high");
var meterEl=document.getElementById("meter");
var overlay=document.getElementById("overlay");
var buttons=[].slice.call(document.querySelectorAll(".lane-btn"));
var dpr=1,w=0,h=0,last=0,lanes=[],hitY=0,topY=0,trackW=0,laneW=0;
var keyMap={d:0,f:1,j:2,k:3,D:0,F:1,J:2,K:3};
var highKey="mikuRhythmHigh";
var high=Number(localStorage.getItem(highKey)||0);
var state={running:false,score:0,combo:0,time:60,energy:0,miss:0,perfect:0,great:0,good:0};
var songTime=0,nextBeat=1.8,bpm=108,beat=60/108,travel=2.35,spawnLane=0,musicStep=0,nextMusic=0;
var notes=[],effects=[],texts=[],press=[0,0,0,0],audio=null,master=null;
var mikuImg=new Image();
mikuImg.src="miku-sprite.png?v=20260621-3";
highEl.textContent=high;

function fit(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  var rect=shell.getBoundingClientRect();
  w=Math.floor(rect.width);h=Math.floor(rect.height);
  canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  topY=92;hitY=h-134;trackW=Math.min(w-54,420);laneW=trackW/4;
  var left=(w-trackW)/2;
  lanes=[left+laneW*.5,left+laneW*1.5,left+laneW*2.5,left+laneW*3.5];
}
window.addEventListener("resize",fit);fit();

function ensureAudio(){
  if(audio)return;
  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
    master=audio.createGain();
    master.gain.value=.16;
    master.connect(audio.destination);
  }catch(e){}
}
function tone(freq,dur,type,gain){
  if(!audio)return;
  var t=audio.currentTime;
  var osc=audio.createOscillator(),g=audio.createGain();
  osc.type=type||"sine";osc.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(gain||.035,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g);g.connect(master||audio.destination);osc.start(t);osc.stop(t+dur);
}
function drum(freq,dur,gain){
  if(!audio)return;
  var t=audio.currentTime,osc=audio.createOscillator(),g=audio.createGain();
  osc.type="sine";osc.frequency.setValueAtTime(freq,t);osc.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.42),t+dur*.8);
  g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g);g.connect(master||audio.destination);osc.start(t);osc.stop(t+dur);
}
function musicTick(step){
  if(!audio||!state.running)return;
  var half=step%2,bar=step%8;
  if(half===0)drum(bar===0?130:108,.12,.08);
  if(bar===4)tone(196,.08,"triangle",.045);
  tone(bar%4===2?880:1320,.035,"square",.018);
  if(bar===0||bar===6)tone(bar===0?262:330,.18,"sine",.035);
}
function laneTone(lane,quality){
  var base=[523,659,784,988][lane];
  tone(base,quality==="Perfect"?.11:.075,"triangle",quality==="Miss"?.012:.04);
}
function addText(text,x,y,color){texts.push({text:text,x:x,y:y,life:.72,color:color})}
function burst(x,y,color,count){
  for(var i=0;i<(count||12);i++){
    var a=Math.random()*Math.PI*2,s=70+Math.random()*180;
    effects.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.42+Math.random()*.25,color:color});
  }
}
function spawnNote(){
  var step=songTime<14?1.25:(Math.random()<.24?1.5:1);
  spawnLane=(spawnLane+(Math.random()<.55?1:Math.floor(Math.random()*3)+1))%4;
  var kind=Math.random()<.1?"star":"note";
  notes.push({lane:spawnLane,hit:nextBeat,kind:kind,done:false,life:1});
  if(songTime>20&&Math.random()<.08){
    var second=(spawnLane+2+Math.floor(Math.random()*2))%4;
    notes.push({lane:second,hit:nextBeat,kind:"note",done:false,life:1});
  }
  nextBeat+=beat*step;
}
function judgeLane(lane){
  if(!state.running)return;
  press[lane]=.13;
  buttons[lane].classList.add("active");
  setTimeout(function(){buttons[lane].classList.remove("active")},95);
  var best=null,bestDiff=999;
  for(var i=0;i<notes.length;i++){
    var n=notes[i];
    if(n.done||n.lane!==lane)continue;
    var diff=Math.abs(n.hit-songTime);
    if(diff<bestDiff){best=n;bestDiff=diff}
  }
  if(!best||bestDiff>.28){
    tone([392,440,494,587][lane],.035,"sine",.01);
    return;
  }
  best.done=true;
  var quality="Good",gain=360,color=varColor("good");
  if(bestDiff<.09){quality="Perfect";gain=980;color=varColor("perfect");state.perfect++}
  else if(bestDiff<.16){quality="Great";gain=680;color=varColor("great");state.great++}
  else{state.good++}
  state.combo++;
  var bonus=Math.min(520,Math.floor(state.combo/8)*60);
  state.score+=gain+bonus+(best.kind==="star"?420:0);
  state.energy=Math.min(100,state.energy+7+(quality==="Perfect"?5:0));
  addText(quality,lanes[lane],hitY-46,color);
  burst(lanes[lane],hitY,color,quality==="Perfect"?22:14);
  laneTone(lane,quality);
}
function varColor(type){
  return type==="perfect"?"#ffd166":type==="great"?"#8df7e7":type==="bad"?"#ff6b91":"#77ddff";
}
buttons.forEach(function(btn){btn.addEventListener("pointerdown",function(e){e.preventDefault();judgeLane(Number(btn.dataset.lane))})});
canvas.addEventListener("pointerdown",function(e){
  if(!state.running)return;
  var rect=canvas.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(y<topY||y>hitY+64)return;
  var left=(w-trackW)/2;
  var lane=Math.max(0,Math.min(3,Math.floor((x-left)/laneW)));
  judgeLane(lane);
});
window.addEventListener("keydown",function(e){
  if(keyMap[e.key]!==undefined){e.preventDefault();judgeLane(keyMap[e.key])}
});

function update(dt){
  if(!state.running)return;
  songTime+=dt;state.time=Math.max(0,60-songTime);
  while(nextMusic<=songTime+.02){musicTick(musicStep++);nextMusic+=beat/2}
  while(nextBeat-songTime<travel+.5)spawnNote();
  for(var i=notes.length-1;i>=0;i--){
    var n=notes[i];
    if(!n.done&&songTime-n.hit>.32){
      n.done=true;state.combo=0;state.miss++;
      addText("MISS",lanes[n.lane],hitY-42,varColor("bad"));
      laneTone(n.lane,"Miss");
    }
    if(n.done){n.life-=dt*4.2;if(n.life<=0)notes.splice(i,1)}
  }
  for(var p=effects.length-1;p>=0;p--){
    effects[p].life-=dt;effects[p].x+=effects[p].vx*dt;effects[p].y+=effects[p].vy*dt;effects[p].vy+=160*dt;
    if(effects[p].life<=0)effects.splice(p,1);
  }
  for(var t=texts.length-1;t>=0;t--){texts[t].life-=dt;texts[t].y-=44*dt;if(texts[t].life<=0)texts.splice(t,1)}
  for(var l=0;l<4;l++)press[l]=Math.max(0,press[l]-dt);
  if(state.time<=0)endGame();
}
function drawBg(now){
  var g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#0a201d");g.addColorStop(.58,"#0d302a");g.addColorStop(1,"#071613");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  var glow=ctx.createRadialGradient(w*.5,h*.18,0,w*.5,h*.18,Math.max(w,h)*.62);
  glow.addColorStop(0,"rgba(57,197,187,.16)");glow.addColorStop(.48,"rgba(57,197,187,.045)");glow.addColorStop(1,"rgba(57,197,187,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
  ctx.fillStyle="rgba(255,209,102,.055)";
  for(var b=0;b<9;b++){
    var bx=(b*73+now*28)%w;
    ctx.fillRect(bx,topY+12,4,hitY-topY-8);
  }
  for(var i=0;i<34;i++){
    var sx=(i*83+now*18)%w,sy=(i*127+now*28)%h;
    ctx.fillStyle="rgba(141,247,231,"+(.18+Math.sin(now*3+i)*.08)+")";
    ctx.beginPath();ctx.arc(sx,sy,1.3,0,Math.PI*2);ctx.fill();
  }
}
function roundRect(x,y,ww,hh,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+ww,y,x+ww,y+hh,r);ctx.arcTo(x+ww,y+hh,x,y+hh,r);ctx.arcTo(x,y+hh,x,y,r);ctx.arcTo(x,y,x+ww,y,r);ctx.closePath();
}
function drawTrack(now){
  var left=(w-trackW)/2;
  for(var i=0;i<4;i++){
    var x=left+i*laneW;
    ctx.fillStyle=i%2?"rgba(222,251,248,.035)":"rgba(57,197,187,.06)";
    ctx.fillRect(x,topY,laneW,hitY-topY+24);
    ctx.strokeStyle="rgba(57,197,187,.20)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,topY);ctx.lineTo(x,hitY+24);ctx.stroke();
    if(press[i]>0){
      ctx.fillStyle="rgba(141,247,231,"+(press[i]*1.8)+")";
      ctx.fillRect(x,topY,laneW,hitY-topY+24);
    }
  }
  ctx.beginPath();ctx.moveTo(left+trackW,topY);ctx.lineTo(left+trackW,hitY+24);ctx.stroke();
  ctx.fillStyle="rgba(255,209,102,.12)";roundRect(left,hitY-24,trackW,48,12);ctx.fill();
  ctx.fillStyle="rgba(141,247,231,.07)";roundRect(left,hitY-44,trackW,88,16);ctx.fill();
  ctx.strokeStyle="rgba(255,209,102,.82)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(left,hitY);ctx.lineTo(left+trackW,hitY);ctx.stroke();
  ctx.font="900 11px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ["D","F","J","K"].forEach(function(k,i){ctx.fillStyle="rgba(222,251,248,.42)";ctx.fillText(k,lanes[i],hitY+32)});
  if(state.combo>=12){
    ctx.font="900 24px Impact, Arial Narrow, sans-serif";ctx.fillStyle="#ffd166";ctx.shadowColor="#ffd166";ctx.shadowBlur=12;
    ctx.fillText("COMBO "+state.combo,w/2,96);ctx.shadowBlur=0;
  }
}
function drawNotes(){
  for(var i=0;i<notes.length;i++){
    var n=notes[i],p=1-(n.hit-songTime)/travel;
    var y=topY+p*(hitY-topY);
    if(y<topY-40||y>hitY+70)continue;
    var x=lanes[n.lane],r=n.kind==="star"?22:20;
    ctx.save();ctx.globalAlpha=Math.max(.18,n.life);
    ctx.translate(x,y);
    ctx.shadowColor=n.kind==="star"?"#ffd166":"#8df7e7";ctx.shadowBlur=18;
    ctx.fillStyle=n.kind==="star"?"#ffd166":"#39c5bb";
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(222,251,248,.42)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+5,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle="rgba(6,18,16,.86)";ctx.font="900 19px Apple Color Emoji, Segoe UI Emoji, sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(n.kind==="star"?"⭐":"♪",0,1);
    ctx.restore();
  }
}
function drawEffects(){
  for(var i=0;i<effects.length;i++){
    var p=effects[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif";
  for(var t=0;t<texts.length;t++){
    var tx=texts[t];ctx.globalAlpha=Math.max(0,tx.life);ctx.fillStyle=tx.color;ctx.shadowColor=tx.color;ctx.shadowBlur=10;ctx.fillText(tx.text,tx.x,tx.y);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}
function draw(now){
  drawBg(now);drawTrack(now);drawNotes();drawEffects();
  scoreEl.textContent=state.score;comboEl.textContent=state.combo;timeEl.textContent=Math.ceil(state.time);highEl.textContent=high;meterEl.style.width=state.energy+"%";
}
function loop(ts){
  var now=ts/1000,dt=last?Math.min(.05,(ts-last)/1000):.016;last=ts;
  update(dt);draw(now);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function startGame(){
  ensureAudio();
  if(audio&&audio.state==="suspended")audio.resume();
  state={running:true,score:0,combo:0,time:60,energy:0,miss:0,perfect:0,great:0,good:0};
  songTime=0;nextBeat=1.8;musicStep=0;nextMusic=0;spawnLane=Math.floor(Math.random()*4);notes=[];effects=[];texts=[];press=[0,0,0,0];last=performance.now();
  overlay.classList.add("hidden");
}
function endGame(){
  if(!state.running)return;
  state.running=false;
  if(state.score>high){high=state.score;localStorage.setItem(highKey,String(high))}
  var rank=state.score>=52000?"世界第一公主殿下":state.score>=36000?"节奏大师":state.score>=20000?"应援达人":"练习生";
  overlay.innerHTML='<div class="panel"><div class="title">RESULT</div><div class="subtitle">'+rank+'</div><div class="score-big">'+state.score+'</div><div class="subtitle">Perfect '+state.perfect+' · Great '+state.great+' · Good '+state.good+' · Miss '+state.miss+'<br>最高分 '+high+'</div><div class="row"><button class="btn" type="button" onclick="startGame()">再来一次</button><a class="btn ghost" href="mikumikufans.html">回主页</a></div></div>';
  overlay.classList.remove("hidden");
}
window.startGame=startGame;
draw(0);
})();
</script>
</body>
</html>
